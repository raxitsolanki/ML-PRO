{% extends "layout_app.html" %}
{% block title %}AI Assistant - DSP Health{% endblock %}

{% block content %}

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>

:root{
--navy:#1e293b;
--emerald:#10b981;
}

/* Wrapper */
.ai-wrapper{
max-width:1100px;
margin:auto;
padding:20px;
}

/* Card */
.ai-card{
background:white;
border-radius:20px;
border:1px solid #e2e8f0;
box-shadow:0 10px 30px rgba(0,0,0,0.05);
display:flex;
flex-direction:column;
height:85vh;
overflow:hidden;
}

/* Header */
.ai-header{
padding:16px 20px;
background:linear-gradient(135deg,var(--navy),#0f172a);
color:white;
display:flex;
justify-content:space-between;
align-items:center;
}

.ai-title{
font-size:18px;
font-weight:600;
}

.ai-sub{
font-size:12px;
opacity:0.7;
}

/* Clear button */
.clear-btn{
background:rgba(255,255,255,0.1);
border:none;
padding:6px 12px;
border-radius:10px;
color:white;
cursor:pointer;
}

.clear-btn:hover{
background:rgba(255,255,255,0.2);
}

/* Chat box */
.chat-box{
flex:1;
overflow-y:auto;
padding:20px;
background:#f8fafc;
scroll-behavior:smooth;
}

/* Messages */
.message{
max-width:75%;
padding:12px 16px;
border-radius:16px;
margin-bottom:12px;
line-height:1.6;
font-size:14px;
word-wrap:break-word;
animation:fadeIn 0.2s ease;
}

.user{
background:var(--emerald);
color:white;
margin-left:auto;
}

.ai{
background:white;
border:1px solid #e2e8f0;
}

/* Typing */
.typing{
font-size:13px;
color:#64748b;
}

/* Input */
.chat-input{
display:flex;
gap:10px;
padding:14px;
border-top:1px solid #e2e8f0;
background:white;
align-items:flex-end;
}

.chat-input textarea{
flex:1;
border:1px solid #e2e8f0;
border-radius:12px;
padding:10px;
resize:none;
outline:none;
font-size:14px;
max-height:120px;
overflow-y:auto;
}

.chat-input button{
background:var(--navy);
color:white;
border:none;
padding:10px 16px;
border-radius:12px;
cursor:pointer;
font-weight:600;
}

/* Welcome */
.welcome{
text-align:center;
margin-top:40px;
color:#64748b;
}

.welcome h2{
font-size:22px;
color:#1e293b;
margin-bottom:6px;
}

/* Animation */
@keyframes fadeIn{
from{opacity:0;transform:translateY(6px);}
to{opacity:1;transform:translateY(0);}
}

/* MOBILE */
@media(max-width:768px){

.ai-wrapper{
padding:10px;
}

.ai-card{
height:92vh;
border-radius:14px;
}

.message{
max-width:90%;
font-size:13px;
}

.chat-box{
padding:14px;
}

.chat-input{
padding:10px;
}

.chat-input textarea{
font-size:13px;
}

.chat-input button{
padding:8px 12px;
font-size:13px;
}

}

</style>

<div class="ai-wrapper">

<h1 class="text-3xl font-bold text-slate-800 mb-4">
AI Health <span class="text-[--emerald]"> Assistant</span>
</h1>

<div class="ai-card">

<!-- Header -->
<div class="ai-header">
<div>
<div class="ai-title">DPS Health AI</div>
<div class="ai-sub">Ask anything about health & wellness</div>
</div>

<button class="clear-btn" onclick="clearChat()">Clear</button>
</div>

<!-- Chat -->
<div id="chat-box" class="chat-box">

<div class="welcome">
<h2>👋 Welcome</h2>
<p>Ask about diabetes, diet, fitness & more</p>
</div>

</div>

<!-- Input -->
<div class="chat-input">

<textarea id="message"
rows="1"
placeholder="Type your question..."></textarea>

<button onclick="sendMessage()">Send</button>

</div>

</div>
</div>

<script>

let chatBox = document.getElementById("chat-box")

/* Add Message */
function addMessage(text,type){

let div=document.createElement("div")
div.className="message "+type
div.innerHTML=marked.parse(text)

chatBox.appendChild(div)
chatBox.scrollTop=chatBox.scrollHeight

hljs.highlightAll()
}

/* Send Message */
async function sendMessage(){

let input=document.getElementById("message")
let text=input.value.trim()

if(!text) return

document.querySelector(".welcome")?.remove()

addMessage(text,"user")
input.value=""

/* Typing */
let typing=document.createElement("div")
typing.className="message ai typing"
typing.innerHTML="🤖 Typing..."
chatBox.appendChild(typing)

chatBox.scrollTop=chatBox.scrollHeight

try{

let res=await fetch("/chat",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({message:text})
})

let data=await res.json()

typing.remove()

addMessage(data.reply,"ai")

}catch{
typing.innerText="Server error..."
}

}

/* Clear Chat */
function clearChat(){
chatBox.innerHTML=`
<div class="welcome">
<h2>👋 Welcome</h2>
<p>Ask about diabetes, diet, fitness & more</p>
</div>`
}

/* Enter Send */
document.getElementById("message").addEventListener("keydown",function(e){
if(e.key==="Enter" && !e.shiftKey){
e.preventDefault()
sendMessage()
}
})

/* Auto Resize */
const textarea = document.getElementById("message");
textarea.addEventListener("input", () => {
textarea.style.height = "auto";
textarea.style.height = textarea.scrollHeight + "px";
});

</script>

{% endblock %}
