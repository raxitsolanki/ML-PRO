{% extends "layout_app.html" %}
{% block title %}AI Assistant - DSP Health{% endblock %}

{% block content %}

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>

  :root {
    --navy: #1e293b;
    --emerald: #10b981;
    --border: #e2e8f0;
    --bg-light: #f8fafc;
}

/* GLOBAL RESET */
* {
    box-sizing: border-box;
}

html, body {
    height: 100%;
    margin: 0;
    background-color: #f1f5f9;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
}

/* MAIN CONTAINER - Using dvh for better mobile support */
.main-content {
    display: flex;
    flex-direction: column;
    height: 100dvh; 
}

/* WRAPPER */
.ai-wrapper {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden; /* Prevents outer body scroll */
}

@media (max-width: 640px) {
    .ai-wrapper {
        padding: 10px;
    }
}

/* THE CARD - The key Flexbox container */
.ai-card {
    background: white;
    border-radius: 20px;
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    display: flex;
    flex-direction: column;
    height: 100%; 
    overflow: hidden; /* Clips the inner children (header/box/input) */
}

/* HEADER - Fixed at top of card */
.ai-header {
    flex-shrink: 0;
    padding: 14px 16px;
    background: linear-gradient(135deg, var(--navy), #0f172a);
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* CHAT BOX - This grows to fill space and scrolls */
.chat-box {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 20px;
    background: var(--bg-light);
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch; /* Smooth mobile scroll */
}

/* MESSAGE STYLING */
.message {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 16px;
    margin-bottom: 16px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
    position: relative;
}

.user {
    background: var(--emerald);
    color: white;
    margin-left: auto;
    border-bottom-right-radius: 4px;
}

.ai {
    background: white;
    border: 1px solid var(--border);
    margin-right: auto;
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.02);
}

/* FOOTER / INPUT AREA - Fixed at bottom of card */
.chat-input {
    flex-shrink: 0;
    display: flex;
    gap: 10px;
    padding: 16px;
    border-top: 1px solid var(--border);
    background: white;
}

.chat-input textarea {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    resize: none;
    outline: none;
    font-size: 14px;
    max-height: 150px;
    transition: border-color 0.2s;
}

.chat-input textarea:focus {
    border-color: var(--emerald);
}

/* BUTTONS */
.chat-input button {
    background: var(--navy);
    color: white;
    border: none;
    padding: 0 20px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    transition: opacity 0.2s;
}

.chat-input button:hover {
    opacity: 0.9;
}

.clear-btn {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: white;
    padding: 6px 12px;
    border-radius: 10px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
}

.clear-btn:hover {
    background: #ef4444;
    border-color: #ef4444;
}

/* HELPERS */
.message pre {
    background: #0f172a;
    color: #e2e8f0;
    padding: 12px;
    border-radius: 10px;
    overflow-x: auto;
    margin: 10px 0;
}

/* MOBILE FIXES */
@media (max-width: 640px) {
    .message { max-width: 90%; }
    .chat-input { padding: 10px; }
}
</style>

<div class="main-content" >

<div class="ai-wrapper">

<h1 class="text-3xl font-bold text-slate-800 mb-4">
AI Health <span class="text-[--emerald]">Assistant</span>
</h1>

<div class="ai-card">

<!-- HEADER -->
<div class="ai-header">
<div>
<div>DPS Health AI</div>
<small>Ask anything about health</small>
</div>

<button class="clear-btn">Clear Chat
  </button>
</div>

<!-- 🔥 SCROLL ONLY HERE -->
<div id="chat-box" class="chat-box">
<div class="welcome">
<h2>👋 Welcome</h2>
<p>Ask about diabetes, diet, fitness & more</p>
</div>
</div>

<!-- INPUT -->
<div class="chat-input">
<textarea id="message" rows="1" placeholder="Type message..."></textarea>
<button onclick="sendMessage()">Send</button>
</div>

</div>
</div>
</div>

<script>

    let chatBox = document.getElementById("chat-box")

    /* ADD MESSAGE */
    function addMessage(text, type){
    
    let div = document.createElement("div")
    div.className = "message " + type
    
    // ✅ ChatGPT-like markdown render
    div.innerHTML = marked.parse(text, {
      breaks: true,
      gfm: true
    })
    
    chatBox.appendChild(div)
    
    /* ✅ Highlight only inside this message */
    div.querySelectorAll('pre code').forEach(el => {
      hljs.highlightElement(el);
    })
    
    /* ✅ Smooth scroll */
    chatBox.scrollTo({
      top: chatBox.scrollHeight,
      behavior: "smooth"
    })
    }
    
    
    /* SEND MESSAGE */
    async function sendMessage(){
    
    let input = document.getElementById("message")
    let text = input.value.trim()
    
    if(!text) return
    
    document.querySelector(".welcome")?.remove()
    
    addMessage(text, "user")
    
    input.value = ""
    input.style.height = "auto"
    
    /* Typing UI */
    let typing = document.createElement("div")
    typing.className = "message ai"
    typing.innerHTML = "🤖 <i>Typing...</i>"
    chatBox.appendChild(typing)
    
    chatBox.scrollTop = chatBox.scrollHeight
    
    try{
    
    let res = await fetch("/chat", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({message:text})
    })
    
    let data = await res.json()
    
    typing.remove()
    
    addMessage(data.reply || "⚠️ No response", "ai")
    
    }catch{
    typing.innerHTML = "❌ Server error..."
    }
    }
    
    
    /* CLEAR */
    document.querySelector(".clear-btn").onclick = () => {
    chatBox.innerHTML = `
    <div class="welcome">
    <h2>👋 Welcome</h2>
    <p>Ask about diabetes, diet, fitness & more</p>
    </div>`
    }
    
    
    /* ENTER SEND */
    document.getElementById("message").addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault()
    sendMessage()
    }
    })
    
    
    /* AUTO RESIZE */
    const textarea = document.getElementById("message");
    
    textarea.addEventListener("input", () => {
    textarea.style.height = "auto"
    textarea.style.height = textarea.scrollHeight + "px"
    })
</script>

{% endblock %}
