{% extends "layout_app.html" %}
{% block title %}AI Assistant - DSP Health{% endblock %}

{% block content %}

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>

:root{
--navy:#1e293b;
--emerald:#10b981;
}

/* Main Wrapper */
.ai-wrapper{
max-width:1100px;
margin:auto;
padding-top:40px;
}

/* Card */
.ai-card{
background:white;
border-radius:24px;
border:1px solid #e2e8f0;
box-shadow:0 10px 30px rgba(0,0,0,0.05);
overflow:hidden;
display:flex;
flex-direction:column;
height:85vh;
}

/* Header */
.ai-header{
padding:18px 24px;
background:linear-gradient(135deg,var(--navy),#0f172a);
color:white;
display:flex;
justify-content:space-between;
align-items:center;
}

.ai-title{
font-size:18px;
font-weight:600;
}

.ai-sub{
font-size:12px;
opacity:0.7;
}

/* Clear Button */
.clear-btn{
background:rgba(255,255,255,0.1);
border:none;
padding:6px 12px;
border-radius:10px;
color:white;
cursor:pointer;
transition:0.2s;
}

.clear-btn:hover{
background:rgba(255,255,255,0.2);
}

/* Chat Area */
.chat-box{
flex:1;
overflow-y:auto;
padding:24px;
background:#f8fafc;
}

/* Messages */
.message{
max-width:75%;
padding:14px 18px;
border-radius:16px;
margin-bottom:14px;
line-height:1.6;
animation:fadeIn 0.25s ease;
}

.user{
background:var(--emerald);
color:white;
margin-left:auto;
}

.ai{
background:white;
border:1px solid #e2e8f0;
}

/* Typing */
.typing{
font-size:14px;
color:#64748b;
}

/* Input Area */
.chat-input{
display:flex;
gap:12px;
padding:18px;
border-top:1px solid #e2e8f0;
background:white;
}

.chat-input textarea{
flex:1;
border:1px solid #e2e8f0;
border-radius:14px;
padding:12px;
resize:none;
outline:none;
font-size:14px;
}

.chat-input button{
background:var(--navy);
color:white;
border:none;
padding:12px 20px;
border-radius:14px;
cursor:pointer;
font-weight:600;
transition:0.2s;
}

.chat-input button:hover{
background:var(--emerald);
}

/* Welcome Box */
.welcome{
text-align:center;
margin-top:40px;
color:#64748b;
}

.welcome h2{
font-size:22px;
font-weight:600;
color:#1e293b;
margin-bottom:8px;
}

/* Animation */
@keyframes fadeIn{
from{opacity:0;transform:translateY(8px);}
to{opacity:1;transform:translateY(0);}
}

/* Mobile */
@media(max-width:768px){
.ai-card{
height:90vh;
}
}

</style>

<div class="ai-wrapper">

<h1 class="text-3xl font-bold text-slate-800 mb-6">
AI Health Assistant
</h1>

<div class="ai-card">

<!-- Header -->
<div class="ai-header">
<div>
<div class="ai-title">DSP Health AI</div>
<div class="ai-sub">Ask anything about health & wellness</div>
</div>

<button class="clear-btn" onclick="clearChat()">Clear</button>
</div>

<!-- Chat -->
<div id="chat-box" class="chat-box">

<div class="welcome">
<h2>👋 Welcome to DSP Health AI</h2>
<p>Ask questions about diabetes, diet, fitness and more.</p>
</div>

</div>

<!-- Input -->
<div class="chat-input">

<textarea id="message"
rows="1"
placeholder="Type your question..."></textarea>

<button onclick="sendMessage()">Send</button>

</div>

</div>

</div>

<script>

let chatBox=document.getElementById("chat-box")

function addMessage(text,type){

let div=document.createElement("div")
div.className="message "+type
div.innerHTML=marked.parse(text)

chatBox.appendChild(div)

chatBox.scrollTop=chatBox.scrollHeight

hljs.highlightAll()

}

/* Send Message */

async function sendMessage(){

let input=document.getElementById("message")
let text=input.value.trim()

if(!text) return

/* remove welcome */
document.querySelector(".welcome")?.remove()

addMessage(text,"user")

input.value=""

/* typing */

let typing=document.createElement("div")
typing.className="message ai typing"
typing.innerText="AI is typing..."
chatBox.appendChild(typing)

chatBox.scrollTop=chatBox.scrollHeight

try{

let res=await fetch("/chat",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:text
})
})

let data=await res.json()

typing.remove()

addMessage(data.reply,"ai")

}catch{

typing.innerText="Server error..."

}

}

/* Clear Chat */

function clearChat(){
chatBox.innerHTML=`
<div class="welcome">
<h2>👋 Welcome to DSP Health AI</h2>
<p>Ask questions about diabetes, diet, fitness and more.</p>
</div>`
}

/* Enter key */

document.getElementById("message").addEventListener("keydown",function(e){

if(e.key==="Enter" && !e.shiftKey){
e.preventDefault()
sendMessage()
}

})

</script>

{% endblock %}
