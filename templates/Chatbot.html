{% extends "layout_app.html" %}
{% block title %}AI Assistant - DSP Health{% endblock %}

{% block content %}

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>

    :root{
        --navy:#1e293b;
        --emerald:#10b981;
        }
        
        /* FULL HEIGHT */
        html, body{
        height:100%;
        margin:0;
        }
        
        /* MAIN CONTENT */
        .main-content{
        display:flex;
        flex-direction:column;
        min-height:100vh;
        }
        
        /* WRAPPER */
        .ai-wrapper{
        max-width:1100px;
        margin:auto;
        padding:20px;
        width:100%;
        flex:1;
        display:flex;
        flex-direction:column;
        }
        
        /* MOBILE WRAPPER */
        @media(max-width:640px){
        .ai-wrapper{
        padding:12px;
        }
        }
        
        /* CARD */
        .ai-card{
        background:white;
        border-radius:20px;
        border:1px solid #e2e8f0;
        box-shadow:0 10px 30px rgba(0,0,0,0.05);
        display:flex;
        flex-direction:column;
        flex:1;
        overflow:hidden;
        }
        
        /* HEADER */
        .ai-header{
        padding:14px 16px;
        background:linear-gradient(135deg,var(--navy),#0f172a);
        color:white;
        display:flex;
        justify-content:space-between;
        align-items:center;
        }
        
        @media(max-width:640px){
        .ai-header small{
        font-size:11px;
        }
        }
        
        /* CLEAR BUTTON */
        .clear-btn{
        background:#ef4444;
        border:none;
        padding:7px 12px;
        border-radius:8px;
        color:white;
        cursor:pointer;
        font-size:12px;
        }
        
        /* CHAT AREA */
        .chat-box{
        flex:1;
        overflow-y:auto;
        padding:18px;
        background:#f8fafc;
        scroll-behavior:smooth;
        }
        
        @media(max-width:640px){
        .chat-box{
        padding:12px;
        }
        }
        
        /* MESSAGE */
        .message{
        max-width:75%;
        padding:12px 16px;
        border-radius:16px;
        margin-bottom:12px;
        font-size:14px;
        
        /* 🔥 IMPORTANT FIXES */
        word-wrap:break-word;
        overflow-wrap:break-word;
        word-break:break-word;
        }
        
        /* MOBILE MESSAGE */
        @media(max-width:640px){
        .message{
        max-width:90%;
        font-size:13px;
        }
        }
        
        /* USER */
        .user{
        background:var(--emerald);
        color:white;
        margin-left:auto;
        }
        
        /* AI */
        .ai{
        background:white;
        border:1px solid #e2e8f0;
        max-width:80%;
        }
        
        /* 🔥 CODE BLOCK FIX */
        .message pre{
        background:#0f172a;
        color:#fff;
        padding:10px;
        border-radius:10px;
        overflow-x:auto;
        max-width:100%;
        font-size:13px;
        }
        
        /* INLINE CODE */
        .message code{
        word-break:break-word;
        }
        
        /* 🔥 IMAGES / TABLE SAFE */
        .message img,
        .message table{
        max-width:100%;
        display:block;
        overflow-x:auto;
        }
        
        /* INPUT AREA */
        .chat-input{
        display:flex;
        gap:10px;
        padding:12px;
        border-top:1px solid #e2e8f0;
        background:white;
        }
        
        /* MOBILE INPUT STACK */
        @media(max-width:500px){
        .chat-input{
        flex-direction:column;
        }
        
        .chat-input button{
        width:100%;
        }
        }
        
        /* TEXTAREA */
        .chat-input textarea{
        flex:1;
        border:1px solid #e2e8f0;
        border-radius:12px;
        padding:10px;
        resize:none;
        outline:none;
        font-size:14px;
        max-height:120px;
        }
        
        @media(max-width:640px){
        .chat-input textarea{
        font-size:13px;
        padding:9px;
        }
        }
        
        /* BUTTON */
        .chat-input button{
        background:var(--navy);
        color:white;
        border:none;
        padding:10px 16px;
        border-radius:12px;
        cursor:pointer;
        }
        
        /* HEADING */
        h1{
        font-size:28px;
        }
        
        @media(max-width:640px){
        h1{
        font-size:22px;
        }
        }
        
        /* 🔥 OPTIONAL SMOOTH ANIMATION */
        .message{
        animation:fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn{
        from{
        opacity:0;
        transform:translateY(10px);
        }
        to{
        opacity:1;
        transform:translateY(0);
        }
        }
</style>

<div class="main-content">

<div class="ai-wrapper">

<h1 class="text-3xl font-bold text-slate-800 mb-4">
AI Health <span class="text-[--emerald]">Assistant</span>
</h1>

<div class="ai-card">

<!-- HEADER -->
<div class="ai-header">
<div>
<div>DPS Health AI</div>
<small>Ask anything about health</small>
</div>

<button class="clear-btn">Clear</button>
</div>

<!-- 🔥 SCROLL ONLY HERE -->
<div id="chat-box" class="chat-box">
<div class="welcome">
<h2>👋 Welcome</h2>
<p>Ask about diabetes, diet, fitness & more</p>
</div>
</div>

<!-- INPUT -->
<div class="chat-input">
<textarea id="message" rows="1" placeholder="Type message..."></textarea>
<button onclick="sendMessage()">Send</button>
</div>

</div>
</div>
</div>

<script>

    let chatBox = document.getElementById("chat-box")

    /* ✅ ADD MESSAGE */
    function addMessage(text, type){
    
    let div = document.createElement("div")
    div.className = "message " + type
    
    // ✅ Safe markdown render
    let html = marked.parse(text)
    div.innerHTML = html
    
    chatBox.appendChild(div)
    
    /* ✅ Highlight only this message (not whole page) */
    div.querySelectorAll('pre code').forEach(el => {
      hljs.highlightElement(el);
    })
    
    /* ✅ Smooth scroll */
    chatBox.scrollTo({
      top: chatBox.scrollHeight,
      behavior: "smooth"
    })
    }
    
    
    /* ✅ SEND MESSAGE */
    async function sendMessage(){
    
    let input = document.getElementById("message")
    let text = input.value.trim()
    
    if(!text) return
    
    document.querySelector(".welcome")?.remove()
    
    addMessage(text, "user")
    input.value = ""
    input.style.height = "auto"
    
    /* ✅ Typing indicator improved */
    let typing = document.createElement("div")
    typing.className = "message ai"
    typing.innerHTML = "🤖 <i>Typing...</i>"
    chatBox.appendChild(typing)
    
    chatBox.scrollTop = chatBox.scrollHeight
    
    try{
    let res = await fetch("/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({message: text})
    })
    
    let data = await res.json()
    
    typing.remove()
    
    addMessage(data.reply || "⚠️ No response", "ai")
    
    }catch(err){
    typing.innerHTML = "❌ Server error..."
    }
    }
    
    
    /* ✅ CLEAR CHAT */
    document.querySelector(".clear-btn").onclick = () => {
    chatBox.innerHTML = `
    <div class="welcome">
    <h2>👋 Welcome</h2>
    <p>Ask about diabetes, diet, fitness & more</p>
    </div>`
    }
    
    
    /* ✅ ENTER SEND */
    document.getElementById("message").addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault()
    sendMessage()
    }
    })
    
    
    /* ✅ AUTO RESIZE TEXTAREA */
    const textarea = document.getElementById("message");
    
    textarea.addEventListener("input", () => {
    textarea.style.height = "auto"
    textarea.style.height = textarea.scrollHeight + "px"
    })
</script>

{% endblock %}
