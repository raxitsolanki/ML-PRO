{% extends "layout_app.html" %}
{% block title %}AI Assistant - DSP Health{% endblock %}

{% block content %}

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>

    :root{
        --navy:#1e293b;
        --emerald:#10b981;
        }
        
        /* GLOBAL FIX */
        *{
        box-sizing:border-box;
        }
        
        html, body{
        height:100%;
        margin:0;
        }
        
        /* MAIN */
        .main-content{
        display:flex;
        flex-direction:column;
        min-height:100vh;
        }
        
        /* WRAPPER */
        .ai-wrapper{
        max-width:1100px;
        margin:auto;
        padding:20px;
        width:100%;
        flex:1;
        display:flex;
        gap:20px;
        flex-direction:column;
        }
        
        @media(max-width:640px){
        .ai-wrapper{
        padding:12px;
        }
        }
        
        /* CARD */
        .ai-card{
        background:white;
        border-radius:20px;
        border:1px solid #e2e8f0;
        box-shadow:0 10px 30px rgba(0,0,0,0.05);
        display:flex;
        flex-direction:column;
        flex:1;
        overflow:hidden;
        }
        
        /* HEADER */
        .ai-header{
        padding:14px 16px;
        background:linear-gradient(135deg,var(--navy),#0f172a);
        color:white;
        display:flex;
        justify-content:space-between;
        align-items:center;
        }
        
        /* CHAT BOX */
        .chat-box{
        flex:1;
        overflow-y:auto;
        overflow-x:hidden;
        padding:16px;
        background:#f8fafc;
        scroll-behavior:smooth;
        }
        
        /* MESSAGE BASE */
        .message{
        max-width:75%;
        padding:12px 16px;
        border-radius:16px;
        margin-bottom:12px;
        font-size:14px;
        line-height:1.6;
        
        /* 🔥 MAIN FIX */
        white-space:pre-wrap;
        word-break:break-word;
        overflow-wrap:anywhere;
        }
        
        /* MOBILE */
        @media(max-width:640px){
        .message{
        max-width:92%;
        font-size:13px;
        }
        }
        
        /* USER */
        .user{
        background:var(--emerald);
        color:white;
        margin-left:auto;
        }
        
        /* AI */
        .ai{
        background:white;
        border:1px solid #e2e8f0;
        max-width:85%;
        }
        
        /* 🔥 CODE BLOCK (IMPORTANT) */
        .message pre{
        background:#0f172a;
        color:#fff;
        padding:12px;
        border-radius:10px;
        overflow-x:auto;
        white-space:pre;
        max-width:100%;
        font-size:13px;
        }
        
        .message code{
        white-space:pre-wrap;
        word-break:break-word;
        }
        
        /* LIST FIX */
        .message ul,
        .message ol{
        padding-left:18px;
        }
        
        /* TABLE FIX */
        .message table{
        display:block;
        overflow-x:auto;
        max-width:100%;
        }
        
        /* IMAGE FIX */
        .message img{
        max-width:100%;
        height:auto;
        border-radius:8px;
        }
        
        /* INPUT */
        .chat-input{
        display:flex;
        gap:10px;
        padding:12px;
        border-top:1px solid #e2e8f0;
        background:white;
        }
        
        @media(max-width:500px){
        .chat-input{
        flex-direction:column;
        }
        .chat-input button{
        width:100%;
        }
        }
        
        /* TEXTAREA */
        .chat-input textarea{
        flex:1;
        border:1px solid #e2e8f0;
        border-radius:12px;
        padding:10px;
        resize:none;
        outline:none;
        font-size:14px;
        max-height:120px;
        }
        
        /* BUTTON */
        .chat-input button{
        background:var(--navy);
        color:white;
        border:none;
        padding:10px 16px;
        border-radius:12px;
        cursor:pointer;
        }
        .clear-btn{
          background:rgba(255,255,255,0.1);
          border:1px solid rgba(255,255,255,0.2);
          color:white;
          padding:6px 12px;
          border-radius:10px;
          font-size:13px;
          cursor:pointer;
          transition:all 0.25s ease;
          display:flex;
          align-items:center;
          gap:6px;
          }
          
          /* Hover */
          .clear-btn:hover{
          background:#ef4444;
          border-color:#ef4444;
          transform:scale(1.05);
          }
          
          /* Click */
          .clear-btn:active{
          transform:scale(0.95);
          }
</style>

<div class="main-content" >

<div class="ai-wrapper">

<h1 class="text-3xl font-bold text-slate-800 mb-4">
AI Health <span class="text-[--emerald]">Assistant</span>
</h1>

<div class="ai-card">

<!-- HEADER -->
<div class="ai-header">
<div>
<div>DPS Health AI</div>
<small>Ask anything about health</small>
</div>

<button class="clear-btn">
Clear Chat
  </button>
</div>

<!-- 🔥 SCROLL ONLY HERE -->
<div id="chat-box" class="chat-box">
<div class="welcome">
<h2>👋 Welcome</h2>
<p>Ask about diabetes, diet, fitness & more</p>
</div>
</div>

<!-- INPUT -->
<div class="chat-input">
<textarea id="message" rows="1" placeholder="Type message..."></textarea>
<button onclick="sendMessage()">Send</button>
</div>

</div>
</div>
</div>

<script>

    let chatBox = document.getElementById("chat-box")

    /* ADD MESSAGE */
    function addMessage(text, type){
    
    let div = document.createElement("div")
    div.className = "message " + type
    
    // ✅ ChatGPT-like markdown render
    div.innerHTML = marked.parse(text, {
      breaks: true,
      gfm: true
    })
    
    chatBox.appendChild(div)
    
    /* ✅ Highlight only inside this message */
    div.querySelectorAll('pre code').forEach(el => {
      hljs.highlightElement(el);
    })
    
    /* ✅ Smooth scroll */
    chatBox.scrollTo({
      top: chatBox.scrollHeight,
      behavior: "smooth"
    })
    }
    
    
    /* SEND MESSAGE */
    async function sendMessage(){
    
    let input = document.getElementById("message")
    let text = input.value.trim()
    
    if(!text) return
    
    document.querySelector(".welcome")?.remove()
    
    addMessage(text, "user")
    
    input.value = ""
    input.style.height = "auto"
    
    /* Typing UI */
    let typing = document.createElement("div")
    typing.className = "message ai"
    typing.innerHTML = "🤖 <i>Typing...</i>"
    chatBox.appendChild(typing)
    
    chatBox.scrollTop = chatBox.scrollHeight
    
    try{
    
    let res = await fetch("/chat", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({message:text})
    })
    
    let data = await res.json()
    
    typing.remove()
    
    addMessage(data.reply || "⚠️ No response", "ai")
    
    }catch{
    typing.innerHTML = "❌ Server error..."
    }
    }
    
    
    /* CLEAR */
    document.querySelector(".clear-btn").onclick = () => {
    chatBox.innerHTML = `
    <div class="welcome">
    <h2>👋 Welcome</h2>
    <p>Ask about diabetes, diet, fitness & more</p>
    </div>`
    }
    
    
    /* ENTER SEND */
    document.getElementById("message").addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault()
    sendMessage()
    }
    })
    
    
    /* AUTO RESIZE */
    const textarea = document.getElementById("message");
    
    textarea.addEventListener("input", () => {
    textarea.style.height = "auto"
    textarea.style.height = textarea.scrollHeight + "px"
    })
</script>

{% endblock %}
