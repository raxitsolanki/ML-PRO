{% extends "layout_app.html" %}
{% block title %}AI Assistant - DSP Health{% endblock %}

{% block content %}

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>

:root{
--navy:#1e293b;
--emerald:#10b981;
}

/* ✅ GLOBAL FIX (NO ZOOM ISSUE) */
html, body{
height:100%;
margin:0;
overflow:hidden;
}

/* ✅ MAIN CONTENT FIX (AUTO HEIGHT) */
.main-content{
height:100%;
display:flex;
flex-direction:column;
}

/* WRAPPER */
.ai-wrapper{
max-width:1100px;
margin:auto;
padding:20px;
width:100%;
flex:1;
display:flex;
flex-direction:column;
}

/* CARD */
.ai-card{
background:white;
border-radius:20px;
border:1px solid #e2e8f0;
box-shadow:0 10px 30px rgba(0,0,0,0.05);
display:flex;
flex-direction:column;
flex:1;
overflow:hidden;
}

/* HEADER */
.ai-header{
padding:16px 20px;
background:linear-gradient(135deg,var(--navy),#0f172a);
color:white;
display:flex;
justify-content:space-between;
align-items:center;
}

/* CLEAR BUTTON */
.clear-btn{
background:#ef4444;
border:none;
padding:8px 14px;
border-radius:8px;
color:white;
cursor:pointer;
font-size:13px;
font-weight:500;
transition:0.2s;
}

.clear-btn:hover{
background:#dc2626;
}

/* CHAT */
.chat-box{
flex:1;
overflow-y:auto;
padding:20px;
background:#f8fafc;
scroll-behavior:smooth;
-webkit-overflow-scrolling: touch;
}

/* MESSAGE */
.message{
max-width:75%;
padding:12px 16px;
border-radius:16px;
margin-bottom:12px;
font-size:14px;
word-wrap:break-word;
}

.user{
background:var(--emerald);
color:white;
margin-left:auto;
}

.ai{
background:white;
border:1px solid #e2e8f0;
}

/* INPUT */
.chat-input{
display:flex;
gap:10px;
padding:14px;
border-top:1px solid #e2e8f0;
background:white;
flex-shrink:0;

/* 🔥 footer safe */
padding-bottom:calc(14px + env(safe-area-inset-bottom));
}

.chat-input textarea{
flex:1;
border:1px solid #e2e8f0;
border-radius:12px;
padding:10px;
resize:none;
outline:none;
font-size:14px;
max-height:120px;
}

.chat-input button{
background:var(--navy);
color:white;
border:none;
padding:10px 16px;
border-radius:12px;
cursor:pointer;
}

/* MOBILE FIX */
@media(max-width:768px){

.ai-wrapper{
padding:10px;
}

.ai-card{
border-radius:14px;
}

.chat-box{
padding:14px;
}

.message{
max-width:90%;
font-size:13px;
}

.chat-input{
padding:10px;
padding-bottom:calc(10px + env(safe-area-inset-bottom));
}

.chat-input textarea{
font-size:13px;
}

.chat-input button{
padding:8px 12px;
font-size:13px;
}

}

</style>

<!-- MAIN CONTENT -->
<div class="main-content">

<div class="ai-wrapper">

<h1 class="text-3xl font-bold text-slate-800 mb-4">
AI Health <span class="text-[--emerald]"> Assistant</span>
</h1>

<div class="ai-card">

<!-- HEADER -->
<div class="ai-header">
<div>
<div class="ai-title">DPS Health AI</div>
<div class="ai-sub">Ask anything about health & wellness</div>
</div>

<button class="clear-btn">Clear Chat</button>
</div>

<!-- CHAT -->
<div id="chat-box" class="chat-box">
<div class="welcome">
<h2>👋 Welcome</h2>
<p>Ask about diabetes, diet, fitness & more</p>
</div>
</div>

<!-- INPUT -->
<div class="chat-input">
<textarea id="message" rows="1" placeholder="Type your question..."></textarea>
<button onclick="sendMessage()">Send</button>
</div>

</div>
</div>
</div>

<script>

let chatBox = document.getElementById("chat-box")

function addMessage(text,type){
let div=document.createElement("div")
div.className="message "+type
div.innerHTML=marked.parse(text)

chatBox.appendChild(div)
chatBox.scrollTop=chatBox.scrollHeight
hljs.highlightAll()
}

async function sendMessage(){
let input=document.getElementById("message")
let text=input.value.trim()

if(!text) return

document.querySelector(".welcome")?.remove()

addMessage(text,"user")
input.value=""

let typing=document.createElement("div")
typing.className="message ai"
typing.innerHTML="🤖 Typing..."
chatBox.appendChild(typing)

chatBox.scrollTop=chatBox.scrollHeight

try{
let res=await fetch("/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message:text})
})

let data=await res.json()

typing.remove()
addMessage(data.reply,"ai")

}catch{
typing.innerText="Server error..."
}
}

/* CLEAR */
document.querySelector(".clear-btn").addEventListener("click", ()=>{
chatBox.innerHTML=`
<div class="welcome">
<h2>👋 Welcome</h2>
<p>Ask about diabetes, diet, fitness & more</p>
</div>`
})

/* ENTER */
document.getElementById("message").addEventListener("keydown",function(e){
if(e.key==="Enter" && !e.shiftKey){
e.preventDefault()
sendMessage()
}
})

/* AUTO RESIZE */
const textarea = document.getElementById("message");
textarea.addEventListener("input", () => {
textarea.style.height = "auto";
textarea.style.height = textarea.scrollHeight + "px";
});

</script>

{% endblock %}
