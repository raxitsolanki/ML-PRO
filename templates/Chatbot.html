{% extends "layout_app.html" %}
{% block title %}AI Assistant - DSP Health{% endblock %}

{% block content %}

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>

:root{
--navy:#1e293b;
--emerald:#10b981;
}

/* FULL SCREEN WRAPPER */
.ai-wrapper{
height:100vh;
display:flex;
flex-direction:column;
}

/* CARD */
.ai-card{
display:flex;
flex-direction:column;
height:100%;
background:white;
}

/* HEADER */
.ai-header{
position:sticky;
top:0;
z-index:10;
padding:14px;
background:linear-gradient(135deg,var(--navy),#0f172a);
color:white;
display:flex;
justify-content:space-between;
align-items:center;
}

.ai-title{
font-size:16px;
font-weight:600;
}

.ai-sub{
font-size:11px;
opacity:0.7;
}

/* CLEAR BUTTON */
.clear-btn{
background:rgba(255,255,255,0.1);
border:none;
padding:6px 10px;
border-radius:8px;
color:white;
cursor:pointer;
}

/* CHAT AREA */
.chat-box{
flex:1;
overflow-y:auto;
padding:12px;
background:#f8fafc;
scroll-behavior:smooth;
}

/* MESSAGES */
.message{
max-width:80%;
padding:10px 14px;
border-radius:14px;
margin-bottom:10px;
font-size:13px;
line-height:1.5;
word-wrap:break-word;
animation:fadeIn 0.2s ease;
}

.user{
background:var(--emerald);
color:white;
margin-left:auto;
}

.ai{
background:white;
border:1px solid #e2e8f0;
}

/* TYPING */
.typing{
font-size:12px;
color:#64748b;
}

/* INPUT FIXED */
.chat-input{
position:sticky;
bottom:0;
display:flex;
gap:8px;
padding:10px;
background:white;
border-top:1px solid #e2e8f0;
}

.chat-input textarea{
flex:1;
border:1px solid #e2e8f0;
border-radius:12px;
padding:8px;
font-size:14px;
resize:none;
outline:none;
max-height:120px;
overflow-y:auto;
}

.chat-input button{
background:var(--navy);
color:white;
border:none;
padding:8px 12px;
border-radius:10px;
cursor:pointer;
font-size:13px;
}

/* WELCOME */
.welcome{
text-align:center;
margin-top:30px;
color:#64748b;
}

.welcome h2{
font-size:18px;
color:#1e293b;
}

/* ANIMATION */
@keyframes fadeIn{
from{opacity:0;transform:translateY(6px);}
to{opacity:1;transform:translateY(0);}
}

/* DESKTOP */
@media(min-width:768px){

.ai-wrapper{
max-width:1100px;
margin:auto;
height:90vh;
padding:20px;
}

.ai-card{
border-radius:16px;
border:1px solid #e2e8f0;
box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

}

</style>

<div class="ai-wrapper">

<div class="ai-card">

<!-- HEADER -->
<div class="ai-header">
<div>
<div class="ai-title">DPS Health AI</div>
<div class="ai-sub">Ask anything about health</div>
</div>

<button class="clear-btn" onclick="clearChat()">Clear</button>
</div>

<!-- CHAT -->
<div id="chat-box" class="chat-box">

<div class="welcome">
<h2>👋 Welcome</h2>
<p>Ask about diabetes, diet, fitness & more</p>
</div>

</div>

<!-- INPUT -->
<div class="chat-input">

<textarea id="message"
rows="1"
placeholder="Type your question..."></textarea>

<button onclick="sendMessage()">Send</button>

</div>

</div>
</div>

<script>

let chatBox = document.getElementById("chat-box")

/* ADD MESSAGE */
function addMessage(text,type){

let div=document.createElement("div")
div.className="message "+type
div.innerHTML=marked.parse(text)

chatBox.appendChild(div)
chatBox.scrollTop=chatBox.scrollHeight

hljs.highlightAll()
}

/* SEND MESSAGE */
async function sendMessage(){

let input=document.getElementById("message")
let text=input.value.trim()

if(!text) return

document.querySelector(".welcome")?.remove()

addMessage(text,"user")
input.value=""

/* typing */
let typing=document.createElement("div")
typing.className="message ai typing"
typing.innerHTML="🤖 Typing..."
chatBox.appendChild(typing)

chatBox.scrollTop=chatBox.scrollHeight

try{

let res=await fetch("/chat",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({message:text})
})

let data=await res.json()

typing.remove()

addMessage(data.reply,"ai")

}catch{
typing.innerText="Server error..."
}

}

/* CLEAR CHAT */
function clearChat(){
chatBox.innerHTML=`
<div class="welcome">
<h2>👋 Welcome</h2>
<p>Ask about diabetes, diet, fitness & more</p>
</div>`
}

/* ENTER KEY */
document.getElementById("message").addEventListener("keydown",function(e){
if(e.key==="Enter" && !e.shiftKey){
e.preventDefault()
sendMessage()
}
})

/* AUTO RESIZE */
const textarea = document.getElementById("message");
textarea.addEventListener("input", () => {
textarea.style.height = "auto";
textarea.style.height = textarea.scrollHeight + "px";
});

</script>
{% endblock %}
